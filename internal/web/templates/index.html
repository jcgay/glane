<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>glane · veille techno</title>
  <meta name="description" content="Recherche dans votre veille technologique : dépôts, articles et posts glanés au fil de l'eau.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">
  <script src="/static/htmx.min.js"></script>
  <style>
    :root {
      --bg: #faf9f7;
      --surface: #ffffff;
      --surface-2: #f3f1ec;
      --border: #e7e2da;
      --border-strong: #d8d2c7;
      --ink: #1c1b18;
      --muted: #6c665d;
      --faint: #9a9389;
      --accent: #b45309;
      --accent-ink: #8a3f07;
      --accent-soft: #fbeddd;
      --ring: rgba(180, 83, 9, .32);
      --shadow: 0 1px 2px rgba(60, 50, 30, .05), 0 8px 24px -12px rgba(60, 50, 30, .16);
      --src-twitter: #4a86c6;
      --src-bluesky: #0a7ea4;
      --src-mastodon: #7a5bc0;
      --src-github: #5b6470;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141310;
        --surface: #1c1b16;
        --surface-2: #24221b;
        --border: #2d2b23;
        --border-strong: #3a372d;
        --ink: #ece9e2;
        --muted: #a49d92;
        --faint: #736d62;
        --accent: #e79f56;
        --accent-ink: #efb277;
        --accent-soft: #2a2015;
        --ring: rgba(231, 159, 86, .3);
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -14px rgba(0, 0, 0, .6);
        --src-twitter: #6ba3dd;
        --src-bluesky: #45a7c9;
        --src-mastodon: #a281e0;
        --src-github: #9aa2ad;
      }
    }

    /* let native widgets (date picker, scrollbars) follow the page theme */
    :root { color-scheme: light dark; }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .wrap { max-width: 780px; margin: 0 auto; padding: 0 1.25rem; }

    /* --- header / hero --- */
    header {
      padding: 3.25rem 0 1.5rem;
      display: flex; align-items: baseline; justify-content: space-between;
    }
    a.stats-link { color: var(--muted); text-decoration: none; font-size: .9rem; }
    a.stats-link:hover { color: var(--accent-ink); }
    .brand { display: flex; align-items: baseline; gap: .6rem; }
    .brand h1 {
      font-size: 2rem; font-weight: 600; letter-spacing: -.03em;
      margin: 0; line-height: 1;
    }
    .brand .mark { font-size: 1.5rem; line-height: 1; transform: translateY(1px); }
    .brand p {
      margin: 0; color: var(--muted); font-size: .9rem; letter-spacing: -.01em;
    }

    /* --- search toolbar (sticky) --- */
    .toolbar {
      position: sticky; top: 0; z-index: 10;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: saturate(1.4) blur(10px);
      -webkit-backdrop-filter: saturate(1.4) blur(10px);
      padding: .9rem 0 .75rem;
      margin-bottom: .5rem;
    }
    .search {
      position: relative; display: flex; align-items: center;
    }
    .search svg {
      position: absolute; left: .95rem; width: 18px; height: 18px;
      color: var(--faint); pointer-events: none;
    }
    .search input {
      width: 100%; font: inherit; font-size: 1.05rem; color: var(--ink);
      background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: .8rem; padding: .8rem 1rem .8rem 2.85rem;
      box-shadow: var(--shadow); transition: border-color .18s, box-shadow .18s;
    }
    .search input::placeholder { color: var(--faint); }
    .search input:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--ring), var(--shadow);
    }

    /* thin loading bar under the search field */
    .bar {
      height: 2px; margin-top: .55rem; border-radius: 2px; overflow: hidden;
      background: transparent;
    }
    .bar.htmx-request { background: var(--border); }
    .bar.htmx-request::after {
      content: ""; display: block; height: 100%; width: 40%;
      background: var(--accent); border-radius: 2px;
      animation: slide 1s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }

    /* --- source + date filters (segmented) --- */
    .filters { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin-top: .7rem; }
    .sources { display: flex; flex-wrap: wrap; gap: .4rem; }
    .sources label {
      display: inline-flex; align-items: center; gap: .4rem;
      font-size: .82rem; color: var(--muted); cursor: pointer;
      padding: .3rem .7rem; border-radius: 2rem;
      border: 1px solid var(--border); background: var(--surface);
      transition: color .15s, border-color .15s, background .15s;
      user-select: none;
    }
    .sources label:hover { border-color: var(--border-strong); color: var(--ink); }
    .sources input { position: absolute; opacity: 0; width: 0; height: 0; }
    .sources label:has(input:checked) {
      color: var(--accent-ink); border-color: var(--accent);
      background: var(--accent-soft); font-weight: 500;
    }
    .sources label:has(input:focus-visible) { box-shadow: 0 0 0 3px var(--ring); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
    .dot.twitter { background: var(--src-twitter); }
    .dot.bluesky { background: var(--src-bluesky); }
    .dot.mastodon { background: var(--src-mastodon); }
    .dot.github { background: var(--src-github); }

    /* date filter, tag menu and active tag: one pill shape, three contents */
    .since, .tags-filter > summary, .active-tag {
      display: inline-flex; align-items: center; gap: .4rem;
      font: inherit; font-size: .82rem; color: var(--muted);
      padding: .3rem .7rem; border-radius: 2rem;
      border: 1px solid var(--border); background: var(--surface);
      transition: color .15s, border-color .15s, background .15s, box-shadow .15s;
    }
    .since:hover, .tags-filter > summary:hover, .active-tag:hover { border-color: var(--border-strong); }
    .since:focus-within, .tags-filter > summary:focus-visible, .active-tag:focus-visible {
      border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); outline: none;
    }
    .since input {
      font: inherit; color: var(--ink); background: none;
      border: 0; padding: 0; outline: none;
    }

    /* tag menu: the cloud used to live in the idle screen, which the page no
       longer lands on — so it hangs off a pill in the filter row instead */
    .tags-filter { position: relative; }
    .tags-filter > summary { cursor: pointer; list-style: none; user-select: none; }
    .tags-filter > summary::-webkit-details-marker { display: none; }
    .tags-filter > summary::after { content: "▾"; color: var(--faint); font-size: .9em; }
    .tags-filter[open] > summary { border-color: var(--border-strong); color: var(--ink); }
    .tags-filter .tagcloud {
      position: absolute; z-index: 20; top: calc(100% + .4rem); left: 0;
      width: max-content; max-width: min(85vw, 30rem); max-height: 15rem; overflow-y: auto;
      justify-content: flex-start; padding: .6rem;
      background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: .7rem; box-shadow: var(--shadow);
    }

    /* the tag being browsed — it now survives date/source changes, so it needs
       to be visible and clearable */
    .active-tag {
      cursor: pointer; color: var(--accent-ink);
      border-color: var(--accent); background: var(--accent-soft); font-weight: 500;
    }
    .active-tag[hidden] { display: none; }
    .active-tag::after { content: "✕"; opacity: .55; font-size: .9em; }
    .active-tag:hover::after { opacity: 1; }

    /* --- results --- */
    main { padding-bottom: 5rem; }

    /* --- tag cloud --- */
    .tagcloud { display: flex; flex-wrap: wrap; gap: .4rem; }
    .tagcloud .tag {
      font-size: .82rem; color: var(--muted); text-decoration: none;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: .5rem; padding: .2rem .6rem;
      transition: color .15s, border-color .15s, background .15s;
    }
    .tagcloud .tag::before { content: "#"; color: var(--faint); }
    .tagcloud .tag .n { color: var(--faint); margin-left: .3rem; font-variant-numeric: tabular-nums; }
    .tagcloud .tag .n::before { content: "·"; margin-right: .15rem; }
    .tagcloud .tag:hover { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-soft); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <span class="mark" aria-hidden="true">🌾</span>
        <h1>glane</h1>
        <p>votre veille, retrouvée d'un mot</p>
      </div>
      <a class="stats-link" href="/stats">Stats</a>
    </header>

    <div class="toolbar">
      <!-- hx-trigger="load" opens the page on the newest items rather than a blank
           #results; "submit" keeps Enter from navigating away and losing the query. -->
      <form class="search-form" hx-get="/search" hx-trigger="load, submit"
            hx-target="#results" hx-indicator=".bar">
        <!-- the tag being browsed, set by the tag links (see the script below) so a
             date or source change keeps it instead of silently dropping it -->
        <input type="hidden" name="tag">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path>
          </svg>
          <input type="search" name="q" placeholder="Rechercher un dépôt, un article, un post…" autofocus
                 aria-label="Rechercher dans la veille"
                 hx-get="/search" hx-trigger="input changed delay:300ms, search"
                 hx-target="#results" hx-indicator=".bar" hx-include="closest form">
        </div>
        <div class="bar" aria-hidden="true"></div>

        <div class="filters">
        <div class="sources" role="radiogroup" aria-label="Filtrer par source">
          <label><input type="radio" name="source" value="" checked
                        hx-get="/search" hx-trigger="change" hx-target="#results"
                        hx-indicator=".bar" hx-include="closest form">toutes</label>
          <label><span class="dot twitter"></span><input type="radio" name="source" value="twitter"
                        hx-get="/search" hx-trigger="change" hx-target="#results"
                        hx-indicator=".bar" hx-include="closest form">twitter</label>
          <label><span class="dot bluesky"></span><input type="radio" name="source" value="bluesky"
                        hx-get="/search" hx-trigger="change" hx-target="#results"
                        hx-indicator=".bar" hx-include="closest form">bluesky</label>
          <label><span class="dot mastodon"></span><input type="radio" name="source" value="mastodon"
                        hx-get="/search" hx-trigger="change" hx-target="#results"
                        hx-indicator=".bar" hx-include="closest form">mastodon</label>
          <label><span class="dot github"></span><input type="radio" name="source" value="github"
                        hx-get="/search" hx-trigger="change" hx-target="#results"
                        hx-indicator=".bar" hx-include="closest form">github</label>
        </div>

        <label class="since">depuis
          <input type="date" name="since" aria-label="N'afficher que les items à partir de cette date"
                 hx-get="/search" hx-trigger="change" hx-target="#results"
                 hx-indicator=".bar" hx-include="closest form">
        </label>

        {{if .}}
        <details class="tags-filter">
          <summary>tags</summary>
          <div class="tagcloud">
            {{range .}}<a class="tag" href="#" hx-get="/search?tag={{.Tag | urlquery}}" hx-target="#results" hx-indicator=".bar" hx-include=".search-form">{{.Tag}}<span class="n">{{.Count}}</span></a>{{end}}
          </div>
        </details>
        {{end}}

        <button type="button" class="active-tag" hidden
                aria-label="Retirer le filtre par tag"
                hx-get="/search" hx-target="#results"
                hx-indicator=".bar" hx-include=".search-form"><span></span></button>
        </div>
      </form>
    </div>

    <main>
      <div id="results"></div>
    </main>
  </div>
  <script>
    // The browsed tag is form state (so a date or source change keeps it) and a
    // visible pill (so it can be seen and cleared). Both move together.
    const form = document.querySelector('.search-form');
    const activeTag = document.querySelector('.active-tag');
    const tagsMenu = document.querySelector('.tags-filter');

    function setTag(tag) {
      form.tag.value = tag;
      activeTag.firstElementChild.textContent = tag ? '#' + tag : '';
      activeTag.hidden = !tag;
    }

    // Capture phase: the field must be current before htmx, bound on the link or
    // the pill itself, builds the request that includes the form.
    document.addEventListener('click', e => {
      const link = e.target.closest('a.tag');
      if (link) {
        setTag(new URL(link.getAttribute('hx-get'), location).searchParams.get('tag') || '');
        if (tagsMenu) tagsMenu.open = false;
      } else if (e.target.closest('.active-tag')) {
        setTag('');
      }
    }, true);

    // Typing a query is a fresh intent, so it drops the tag.
    form.q.addEventListener('input', () => setTag(''));
  </script>
</body>
</html>
