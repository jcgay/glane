# XcodeGen spec: `xcodegen` writes Glane.xcodeproj (not committed) from it.
name: Glane
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  Glane:
    type: application
    platform: iOS
    sources: [Glane]
    scheme: {}
    preBuildScripts:
      - name: Build glane (Go)
        script: sh "$SRCROOT/build-go.sh"
        basedOnDependencyAnalysis: false # Go's build cache knows what changed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jcgay.glane
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: glane
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Glane/Bridge.h
        OTHER_LDFLAGS: $(DERIVED_FILE_DIR)/libglane.a -lresolv -framework CoreFoundation -framework Security
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        # the Go build reads the whole repository
        ENABLE_USER_SCRIPT_SANDBOXING: NO
