# https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0 # pure-Go modernc.org/sqlite, no cgo
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    files:
      - completions/glane.fish
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

homebrew_casks:
  - repository:
      owner: jcgay
      name: homebrew-jcgay
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    # no `directory`: Homebrew only discovers casks in Casks/ (cask_dir is
    # hardcoded), unlike formulae which could live at the repo root.
    homepage: "https://github.com/jcgay/glane"
    description: "Full-text and semantic search over your saved tech-watch posts"
    completions:
      fish: completions/glane.fish
    hooks:
      post:
        # binary is unsigned: strip the Gatekeeper quarantine flag on macOS
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/glane"]
          end
    caveats: |
      To let Claude Code search your tech-watch, register the plugin:
        claude plugin marketplace add jcgay/glane
        claude plugin install glane@glane

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
